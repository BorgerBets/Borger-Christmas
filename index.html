<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christmas at the Borger’s 🎄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #143d2b 0%, #0a1f16 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .festive-title {
      font-family: 'Mountains of Christmas', cursive;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .snowflake {
      position: fixed;
      top: -10px;
      color: rgba(255, 255, 255, 0.35);
      user-select: none;
      pointer-events: none;
      z-index: 50;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); }
    }
  </style>
</head>
<body class="pb-16">

  <!-- Header -->
  <header class="pt-10 pb-6 px-4 text-center max-w-3xl mx-auto">
    <!-- Top Action: Copy Share Link -->
    <button onclick="copyShareLink()" class="mb-5 w-full max-w-sm mx-auto py-3 px-4 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold text-sm shadow-lg shadow-amber-900/20 transition flex items-center justify-center gap-2 cursor-pointer">
      <span>🔗</span> Copy Share Link for Family Chat
    </button>

    <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-red-600/20 border border-red-500/30 text-red-200 text-xs font-semibold tracking-wide uppercase mb-3">
      <span>🎅 Live Family Menu & Checklist</span>
      <span id="sync-status" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" title="Connecting..."></span>
    </div>
    <h1 class="festive-title text-5xl sm:text-6xl font-bold text-amber-300 drop-shadow-md">
      Christmas at the Borger’s
    </h1>
    <p class="text-emerald-100/80 mt-2 text-sm sm:text-base">
      Pop your name down and let everyone know what you’re bringing so we don't end up with 6 pavlovas.
    </p>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto px-4 space-y-6">

    <!-- Editable Event Details Card -->
    <section class="glass-card rounded-2xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-amber-300">📍 Day Details & Host Notes</h2>
        <button id="edit-notes-btn" onclick="toggleNotesEdit()" class="text-xs px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-white transition">
          Edit Details
        </button>
      </div>
      <div id="notes-display" class="text-sm text-emerald-50/90 whitespace-pre-line leading-relaxed">
        Loading event details...
      </div>
      <div id="notes-editor" class="hidden space-y-3">
        <textarea id="notes-input" rows="3" class="w-full rounded-xl bg-black/30 border border-white/20 p-3 text-sm text-white focus:outline-none focus:border-amber-400" placeholder="Add address, arrival times, dietary notes..."></textarea>
        <div class="flex justify-end gap-2">
          <button onclick="toggleNotesEdit()" class="text-xs px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20">Cancel</button>
          <button onclick="saveNotes()" class="text-xs px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-semibold">Save Notes</button>
        </div>
      </div>
    </section>

    <!-- Add Item Form -->
    <section class="glass-card rounded-2xl p-5 border-amber-400/30">
      <h2 class="text-base font-bold text-white mb-4 flex items-center gap-2">
        <span>🎁 Add What You’re Bringing</span>
      </h2>
      <form id="add-form" class="grid grid-cols-1 sm:grid-cols-12 gap-3">
        <input type="text" id="person-name" required placeholder="Your Name (e.g. Andrew)" class="sm:col-span-4 rounded-xl bg-black/30 border border-white/15 px-3.5 py-2.5 text-sm text-white placeholder-white/40 focus:outline-none focus:border-amber-400" />
        <select id="category" class="sm:col-span-3 rounded-xl bg-emerald-950 border border-white/15 px-3 py-2.5 text-sm text-white focus:outline-none focus:
