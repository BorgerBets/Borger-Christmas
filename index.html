<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christmas at the Borger’s 🎄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #143d2b 0%, #0a1f16 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .festive-title {
      font-family: 'Mountains of Christmas', cursive;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .inner-glass {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .snowflake {
      position: fixed;
      top: -10px;
      color: rgba(255, 255, 255, 0.35);
      user-select: none;
      pointer-events: none;
      z-index: 50;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); }
    }
  </style>
</head>
<body class="pb-20">

  <!-- Header -->
  <header class="pt-10 pb-6 px-4 text-center max-w-xl mx-auto">
    <!-- Top Action: Copy Share Link -->
    <button onclick="copyShareLink()" class="mb-4 w-full py-3 px-4 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold text-sm shadow-lg shadow-amber-900/20 transition flex items-center justify-center gap-2 cursor-pointer">
      <span>🔗</span> Copy Share Link
    </button>

    <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-emerald-600/20 border border-emerald-500/30 text-emerald-200 text-xs font-semibold tracking-wide uppercase mb-3">
      <span id="sync-status" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      <span>Live & Synced • Anyone can edit</span>
    </div>

    <h1 class="festive-title text-5xl sm:text-6xl font-bold text-amber-300 drop-shadow-md">
      Christmas at the Borger’s
    </h1>

      Pop your name down
